<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maquette LAMIFI Business — partenaires (version simplifiée)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@400;500;600;700;800&family=Montserrat:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="styles.css?v=3.10.3">
  <link rel="stylesheet" href="modules.css?v=3.10.3">
</head>
<body>
  <div class="fake-banner" role="note">Maquette — données fictives. Aucun envoi réel (e-mail, code, base) : tout est simulé dans le navigateur.</div>
  <header class="mock-bar" id="mock-bar">
    <div class="mock-title">LAMIFI Business<span>Version simplifiée</span></div>
    <nav class="role-switch" id="role-switch" aria-label="Choisir un espace"></nav>
    <select class="role-select mock-sel" id="role-select" aria-label="Choisir un espace"></select>
    <select class="mock-sel" id="partner-select" aria-label="Partenaire affiché" hidden></select>
    <select class="mock-sel" id="prole-select" aria-label="Rôle affiché" hidden></select>
    <div class="device-switch" role="group" aria-label="Affichage">
      <button type="button" data-device="pc" class="on" aria-label="Affichage PC">🖥<span class="lbl"> PC</span></button>
      <button type="button" data-device="mobile" aria-label="Affichage mobile">📱<span class="lbl"> Mobile</span></button>
    </div>
    <button type="button" class="notes-toggle" id="notes-toggle" aria-pressed="true">Notes UX</button>
  </header>
  <div class="layout with-notes" id="layout">
    <main id="stage"></main>
    <aside class="notes" id="notes" aria-label="Notes UX de l'écran"></aside>
  </div>
  <div id="toast" aria-live="polite"></div>
  <button type="button" class="demo-fab" id="demo-fab" aria-label="Outils de démo">🛠</button>
  <section class="demo-panel" id="demo-panel" aria-label="Outils de démo" hidden></section>
  <script src="core.js?v=3.10.3"></script>
  <script src="domain.js?v=3.10.3"></script>
  <script src="seed.js?v=3.10.3"></script>
  <script src="ui.js?v=3.10.3"></script>
  <script src="kit.js?v=3.10.3"></script>
  <script src="spaces.js?v=3.10.3"></script>
  <script src="mod-eval.js?v=3.10.3"></script>
  <script src="mod-work.js?v=3.10.3"></script>
  <script src="mod-dash.js?v=3.10.3"></script>
  <script src="mod-admin.js?v=3.10.3"></script>
  <script src="mod-yodan.js?v=3.10.3"></script>
  <script src="mod-history.js?v=3.10.3"></script>
  <script src="notes.js?v=3.10.3"></script>
  <script src="tests.js?v=3.10.3"></script>
  <script>boot();</script>
</body>
</html>
