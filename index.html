<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annuaire des maquettes YODAN</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="annuaire/styles.css?v=3">
</head>
<body>
  <p class="banner">Maquettes — données fictives</p>

  <header class="hero">
    <div class="wrap hero-in">
      <img src="annuaire/logo-yodan.png?v=1" alt="YODAN" class="logo">
      <div>
        <h1>Annuaire des maquettes</h1>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="tools" aria-label="Filtres">
      <label class="search">
        <span class="sr-only">Rechercher une maquette</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input type="search" id="q" placeholder="Rechercher…" autocomplete="off">
      </label>
      <div class="chips" id="chips" role="group" aria-label="Filtrer par projet"></div>
      <label class="toggle">
        <input type="checkbox" id="show-old">
        <span>Anciennes versions</span>
      </label>
    </section>

    <p class="count" id="count" aria-live="polite"></p>
    <div id="list"></div>
  </main>

  <script src="annuaire/maquettes.js?v=14"></script>
  <script src="annuaire/app.js?v=3"></script>
</body>
</html>
